name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5
      - run: npm ci
      - run: npm run verify
      - run: npm publish --provenance --access public
        env:
          # Not needed when npm Trusted Publishing is configured for this repository.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
